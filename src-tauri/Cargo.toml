[package]
name = "go-compressor"
version = "0.1.0"
description = "GO COMPRESSOR - Desktop Multimedia Batch Optimizer"
authors = ["Blackcode"]
edition = "2024"

[lib]
name = "go_compressor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
tokio = { version = "1", features = ["full"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sysinfo = "0.33"
thiserror = "2"
kamadak-exif = "0.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
