name: Quality & Automated Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Quality & Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint & TypeScript typecheck
        run: npm run lint

      - name: Run Vitest with coverage
        run: npm run test:coverage

      - name: Build frontend bundle
        run: npm run build

  rust:
    name: Rust Quality & Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies & FFmpeg
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            ffmpeg

      - name: Setup Windows FFmpeg in PATH
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg --no-progress

      - name: Setup macOS FFmpeg in PATH
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg

      - name: Check Rust formatting (cargo fmt)
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Run Clippy (cargo clippy -D warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run Cargo tests (unit & integration)
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features
