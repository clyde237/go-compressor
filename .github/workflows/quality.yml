name: Quality & Automated Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Quality & Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint & TypeScript typecheck
        run: npm run lint

      - name: Run Vitest with coverage
        run: npm run test:coverage

      - name: Build frontend bundle
        run: npm run build

  rust:
    name: Rust Quality & Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies & FFmpeg
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            ffmpeg
          mkdir -p src-tauri/binaries
          cp $(which ffmpeg) src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          cp $(which ffprobe) src-tauri/binaries/ffprobe-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/*

      - name: Setup Windows FFmpeg & sidecars
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries
          $ffmpeg = (Get-Command ffmpeg -ErrorAction SilentlyContinue)
          $ffprobe = (Get-Command ffprobe -ErrorAction SilentlyContinue)
          if ($ffmpeg) { Copy-Item $ffmpeg.Source src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe -Force }
          if ($ffprobe) { Copy-Item $ffprobe.Source src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe -Force }

      - name: Setup macOS FFmpeg & sidecars
        if: runner.os == 'macOS'
        run: |
          mkdir -p src-tauri/binaries
          FFMPEG_BIN=$(which ffmpeg || true)
          FFPROBE_BIN=$(which ffprobe || true)
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            TRIPLE="aarch64-apple-darwin"
          else
            TRIPLE="x86_64-apple-darwin"
          fi
          if [ -n "$FFMPEG_BIN" ]; then
            cp "$FFMPEG_BIN" "src-tauri/binaries/ffmpeg-$TRIPLE"
            chmod +x "src-tauri/binaries/ffmpeg-$TRIPLE"
          fi
          if [ -n "$FFPROBE_BIN" ]; then
            cp "$FFPROBE_BIN" "src-tauri/binaries/ffprobe-$TRIPLE"
            chmod +x "src-tauri/binaries/ffprobe-$TRIPLE"
          fi

      - name: Check Rust formatting (cargo fmt)
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Run Clippy (cargo clippy -D warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run Cargo tests (unit & integration)
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features
