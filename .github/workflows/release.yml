name: Release Multi-OS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'macos-latest'
            args: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies & setup sidecars
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
          mkdir -p src-tauri/binaries
          echo "Installation des binaires FFmpeg 100% statiques pour Linux (autonomes, zéro dépendance .so)..."
          curl -sSL "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-linux-x64.gz" | gunzip > src-tauri/binaries/gocompressor-ffmpeg-x86_64-unknown-linux-gnu
          curl -sSL "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffprobe-linux-x64.gz" | gunzip > src-tauri/binaries/gocompressor-ffprobe-x86_64-unknown-linux-gnu
          cp src-tauri/binaries/gocompressor-ffmpeg-x86_64-unknown-linux-gnu src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          cp src-tauri/binaries/gocompressor-ffprobe-x86_64-unknown-linux-gnu src-tauri/binaries/ffprobe-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/*
          ./src-tauri/binaries/gocompressor-ffmpeg-x86_64-unknown-linux-gnu -version | head -n 2

      - name: Setup Windows sidecars
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          choco install ffmpeg -y
          New-Item -ItemType Directory -Force -Path src-tauri/binaries
          $realFfmpeg = (Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\ffmpeg" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1).FullName
          $realFfprobe = (Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\ffmpeg" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1).FullName
          if (-not $realFfmpeg) { $realFfmpeg = (Get-Command ffmpeg).Source }
          if (-not $realFfprobe) { $realFfprobe = (Get-Command ffprobe).Source }
          Write-Host "Copying real FFmpeg from: $realFfmpeg"
          Write-Host "Copying real FFprobe from: $realFfprobe"
          Copy-Item $realFfmpeg src-tauri/binaries/gocompressor-ffmpeg-x86_64-pc-windows-msvc.exe -Force
          Copy-Item $realFfprobe src-tauri/binaries/gocompressor-ffprobe-x86_64-pc-windows-msvc.exe -Force
          Copy-Item $realFfmpeg src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe -Force
          Copy-Item $realFfprobe src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe -Force

      - name: Setup macOS sidecars
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p src-tauri/binaries
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            TRIPLE="aarch64-apple-darwin"
            STATIC_FFMPEG="https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-arm64.gz"
            STATIC_FFPROBE="https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffprobe-darwin-arm64.gz"
          else
            TRIPLE="x86_64-apple-darwin"
            STATIC_FFMPEG="https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-x64.gz"
            STATIC_FFPROBE="https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffprobe-darwin-x64.gz"
          fi
          echo "Installation des binaires FFmpeg statiques pour macOS ($TRIPLE)..."
          curl -sSL "$STATIC_FFMPEG" | gunzip > "src-tauri/binaries/gocompressor-ffmpeg-$TRIPLE"
          curl -sSL "$STATIC_FFPROBE" | gunzip > "src-tauri/binaries/gocompressor-ffprobe-$TRIPLE"
          cp "src-tauri/binaries/gocompressor-ffmpeg-$TRIPLE" "src-tauri/binaries/ffmpeg-$TRIPLE"
          cp "src-tauri/binaries/gocompressor-ffprobe-$TRIPLE" "src-tauri/binaries/ffprobe-$TRIPLE"
          chmod +x src-tauri/binaries/*

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri Desktop Application & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'GO COMPRESSOR v__VERSION__'
          releaseBody: |
            ## GO COMPRESSOR — Optimisation et compression multimédia par lots

            ### Nouveautés de la version v__VERSION__
            - Moteur de compression d'images multi-cœurs (Rayon) avec calibrage précis à la taille cible (800 Ko – 2 Mo) par recherche dichotomique.
            - Choix du format de sortie : JPEG, WebP ou PNG pour les images ; MP4, MKV, MOV ou WebM (H.264, H.265, VP9) pour les vidéos.
            - Compression vidéo à taille garantie : plafond de débit calculé depuis la source (≤ 50 % de l'original par défaut) et réduction de résolution optionnelle.
            - File d'attente séquentielle stricte pour le transcodage vidéo (FFmpeg sidecar) plafonnée à 20 vidéos maximum.
            - Préservation stricte de la piste audio stéréo (AAC jusqu'à 128k, Opus en WebM).
            - Restitution non-destructive des médias : sauvegarde par copie, suffixe `_opt` ou sous-dossier horodaté.
            - Export et téléchargement direct d'archives ZIP sécurisées.
            - Télémétrie système CPU & RAM continue en direct.

            ### Fichiers installateurs
            - **Windows** : `.exe` (NSIS) et `.msi` (WiX)
            - **Linux** : `.deb` (Debian / Ubuntu)
            - **macOS** : `.dmg`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
