name: Release Multi-OS

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'macos-latest'
            args: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            ffmpeg

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri Desktop Application & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'GO COMPRESSOR ${{ github.ref_name }}'
          releaseBody: |
            ## GO COMPRESSOR — Optimisation et compression multimédia par lots

            ### Nouveautés de la version ${{ github.ref_name }}
            - Moteur de compression d'images multi-cœurs (Rayon) avec calibrage précis à la taille cible (800 Ko – 2 Mo) par recherche dichotomique.
            - File d'attente séquentielle stricte pour le transcodage vidéo H.264 (FFmpeg sidecar) plafonnée à 20 vidéos maximum.
            - Préservation stricte de la piste audio stéréo (AAC 128k, downmix stéréo 44.1 kHz).
            - Restitution non-destructive des médias : sauvegarde par copie, suffixe `_opt` ou sous-dossier horodaté.
            - Export et téléchargement direct d'archives ZIP sécurisées.
            - Télémétrie système CPU & RAM continue en direct.

            ### Fichiers installateurs
            - **Windows** : `.exe` (NSIS) et `.msi` (WiX)
            - **Linux** : `.deb` (Debian / Ubuntu)
            - **macOS** : `.dmg`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
